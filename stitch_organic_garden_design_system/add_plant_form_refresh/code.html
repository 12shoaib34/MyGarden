<style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
</head>
<body class="bg-background text-on-background min-h-screen pb-[56px] md:pb-0">
<!-- TopAppBar -->
<header class="w-full top-0 sticky bg-background flex items-center justify-between px-container-margin h-16 max-w-7xl mx-auto z-50">
<button class="text-on-surface-variant hover:bg-surface-container-high rounded-full transition-colors p-2 active:scale-95 duration-200 transition-transform">
<i class="w-6 h-6" data-lucide="arrow-left"></i>
</button>
<h1 class="font-title-lg text-title-lg text-primary tracking-tight">Add New Plant</h1>
<div class="w-10 h-10"></div> <!-- Spacer for centering -->
</header>
<main class="max-w-3xl mx-auto px-container-margin py-lg grid gap-lg md:gap-xl">
<!-- Image Upload (Glassmorphism inspired) -->
<div class="relative w-full aspect-square md:aspect-video max-w-sm mx-auto rounded-[24px] bg-surface-container-highest flex flex-col items-center justify-center overflow-hidden border border-outline-variant/30 cursor-pointer hover:bg-surface-dim transition-colors group">
<div class="absolute inset-0 bg-gradient-to-tr from-primary/5 to-transparent z-0"></div>
<i class="w-10 h-10 text-primary/70 z-10 group-hover:scale-110 transition-transform duration-300" data-lucide="camera"></i>
<p class="font-body-md text-body-md text-on-surface-variant mt-sm z-10">Upload Plant Photo</p>
</div>
<!-- Form Fields -->
<form class="grid gap-lg">
<!-- Details Section -->
<section class="bg-surface-container-lowest rounded-[24px] p-md md:p-lg shadow-[0_4px_12px_rgba(0,0,0,0.04)] grid gap-md">
<h2 class="font-title-lg text-title-lg text-on-surface mb-sm">Plant Details</h2>
<div>
<label class="block font-label-lg text-label-lg text-on-surface-variant mb-xs">Plant Name</label>
<input class="w-full bg-surface-container-low border-b-2 border-transparent focus:border-primary focus:ring-0 rounded-2xl px-md py-sm font-body-lg text-body-lg text-on-surface placeholder:text-outline outline-none transition-colors" placeholder="e.g. Monstera Deliciosa" type="text"/>
</div>
<div>
<label class="block font-label-lg text-label-lg text-on-surface-variant mb-xs">Variety (Optional)</label>
<input class="w-full bg-surface-container-low border-b-2 border-transparent focus:border-primary focus:ring-0 rounded-2xl px-md py-sm font-body-lg text-body-lg text-on-surface placeholder:text-outline outline-none transition-colors" placeholder="e.g. Thai Constellation" type="text"/>
</div>
</section>
<!-- Categorization Section -->
<section class="bg-surface-container-lowest rounded-[24px] p-md md:p-lg shadow-[0_4px_12px_rgba(0,0,0,0.04)] grid gap-md">
<h2 class="font-title-lg text-title-lg text-on-surface mb-sm">Categorization</h2>
<div>
<label class="block font-label-lg text-label-lg text-on-surface-variant mb-xs">Category</label>
<div class="flex flex-wrap gap-sm">
<label class="cursor-pointer">
<input class="peer sr-only" name="category" type="radio"/>
<span class="inline-block px-md py-sm rounded-full bg-surface-container-highest text-on-surface-variant font-label-lg text-label-lg peer-checked:bg-primary peer-checked:text-on-primary transition-colors">Vegetable</span>
</label>
<label class="cursor-pointer">
<input class="peer sr-only" name="category" type="radio"/>
<span class="inline-block px-md py-sm rounded-full bg-surface-container-highest text-on-surface-variant font-label-lg text-label-lg peer-checked:bg-primary peer-checked:text-on-primary transition-colors">Fruit</span>
</label>
<label class="cursor-pointer">
<input class="peer sr-only" name="category" type="radio"/>
<span class="inline-block px-md py-sm rounded-full bg-surface-container-highest text-on-surface-variant font-label-lg text-label-lg peer-checked:bg-primary peer-checked:text-on-primary transition-colors">Herb</span>
</label>
<label class="cursor-pointer">
<input class="peer sr-only" name="category" type="radio"/>
<span class="inline-block px-md py-sm rounded-full bg-surface-container-highest text-on-surface-variant font-label-lg text-label-lg peer-checked:bg-primary peer-checked:text-on-primary transition-colors">Flower</span>
</label>
<label class="cursor-pointer">
<input class="peer sr-only" name="category" type="radio"/>
<span class="inline-block px-md py-sm rounded-full bg-surface-container-highest text-on-surface-variant font-label-lg text-label-lg peer-checked:bg-primary peer-checked:text-on-primary transition-colors">Tree</span>
</label>
</div>
</div>
<div class="grid grid-cols-1 md:grid-cols-2 gap-md">
<div>
<label class="block font-label-lg text-label-lg text-on-surface-variant mb-xs">Planting Date</label>
<input class="w-full bg-surface-container-low border-b-2 border-transparent focus:border-primary focus:ring-0 rounded-2xl px-md py-sm font-body-lg text-body-lg text-on-surface outline-none transition-colors" type="date"/>
</div>
<div>
<label class="block font-label-lg text-label-lg text-on-surface-variant mb-xs">Location</label>
<div class="relative">
<select class="w-full appearance-none bg-surface-container-low border-b-2 border-transparent focus:border-primary focus:ring-0 rounded-2xl px-md py-sm font-body-lg text-body-lg text-on-surface outline-none transition-colors pr-10">
<option>Indoor</option>
<option>Outdoor</option>
<option>Balcony</option>
<option>Greenhouse</option>
</select>
<i class="w-5 h-5 absolute right-3 top-1/2 -translate-y-1/2 text-on-surface-variant pointer-events-none" data-lucide="chevron-down"></i>
</div>
</div>
</div>
</section>
<!-- Care Routine Section -->
<section class="bg-surface-container-lowest rounded-[24px] p-md md:p-lg shadow-[0_4px_12px_rgba(0,0,0,0.04)] grid gap-md">
<h2 class="font-title-lg text-title-lg text-on-surface mb-sm">Care Routine</h2>
<div>
<div class="flex justify-between items-center mb-xs">
<label class="font-label-lg text-label-lg text-on-surface-variant flex items-center gap-2">
<i class="w-5 h-5 text-primary" data-lucide="droplets"></i>
                            Watering Frequency
                        </label>
<span class="font-body-md text-body-md text-primary font-medium">Every <span id="water-val">7</span> days</span>
</div>
<input class="w-full accent-primary h-2 bg-surface-container-high rounded-full appearance-none cursor-pointer" max="30" min="1" oninput="document.getElementById('water-val').innerText = this.value" type="range" value="7"/>
</div>
<div class="mt-sm">
<div class="flex justify-between items-center mb-xs">
<label class="font-label-lg text-label-lg text-on-surface-variant flex items-center gap-2">
<i class="w-5 h-5 text-primary" data-lucide="leaf"></i>
                            Fertilizer Frequency
                        </label>
<span class="font-body-md text-body-md text-primary font-medium">Every <span id="fert-val">14</span> days</span>
</div>
<input class="w-full accent-primary h-2 bg-surface-container-high rounded-full appearance-none cursor-pointer" max="60" min="0" oninput="document.getElementById('fert-val').innerText = this.value" type="range" value="14"/>
</div>
</section>
<!-- Submit Action -->
<div class="mt-md mb-xl">
<button class="w-full bg-primary text-on-primary font-label-lg text-label-lg h-14 rounded-full shadow-[0_4px_12px_rgba(0,0,0,0.04)] hover:bg-surface-tint active:scale-95 transition-all duration-200 flex items-center justify-center gap-2" type="button">
<i class="w-5 h-5" data-lucide="plus"></i>
                    Add to My Garden
                </button>
</div>
</form>
</main>
<script>
  lucide.createIcons();
</script>
</body></html>
