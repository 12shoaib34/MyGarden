<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
            display: inline-block;
            line-height: 1;
            text-transform: none;
            letter-spacing: normal;
            word-wrap: normal;
            white-space: nowrap;
            direction: ltr;
        }

        /* Ambient Botanical Pattern */
        .botanical-bg {
            background-color: #faf9f5;
            background-image: radial-gradient(#0d631b08 1.5px, transparent 1.5px);
            background-size: 32px 32px;
        }

        @keyframes fade-in-up {
            0% { opacity: 0; transform: translateY(20px); }
            100% { opacity: 1; transform: translateY(0); }
        }

        @keyframes logo-float {
            0%, 100% { transform: translateY(0) scale(1); }
            50% { transform: translateY(-10px) scale(1.02); }
        }

        .animate-fade-in-up {
            animation: fade-in-up 1.2s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        .animate-logo {
            animation: logo-float 6s ease-in-out infinite;
        }

        .delay-100 { animation-delay: 0.1s; }
        .delay-200 { animation-delay: 0.2s; }
    </style>

<body class="bg-background text-on-background font-body-md text-body-md overflow-hidden h-screen w-full selection:bg-primary-container selection:text-on-primary-container">
<!-- Splash Canvas -->
<main class="relative flex flex-col items-center justify-center h-full w-full botanical-bg px-container-margin overflow-hidden">
<!-- Subtle Organic Blobs for Depth -->
<div class="absolute -top-24 -left-24 w-96 h-96 bg-secondary-container opacity-20 blur-[100px] rounded-full"></div>
<div class="absolute -bottom-24 -right-24 w-80 h-80 bg-primary opacity-10 blur-[100px] rounded-full"></div>
<!-- Central Identity Cluster -->
<div class="flex flex-col items-center text-center z-10 max-w-sm">
<!-- Logo Container -->

</div>
</div>
<!-- Brand Name -->
<div class="animate-fade-in-up">
<h1 class="font-display-lg text-primary text-headline-lg-mobile md:text-display-lg tracking-tight mb-2">
                    Leaf &amp; Soil
                </h1>
</div>
<!-- Tagline -->
<div class="animate-fade-in-up delay-100">
<p class="font-body-lg text-on-surface-variant tracking-wide opacity-80 italic">
                    Organic Gardening &amp; Plant Care
                </p>
</div>
</div>
<!-- Interactive Micro-Atmosphere: Floating Particles -->
<div class="absolute inset-0 pointer-events-none" id="atmosphere"></div>
<!-- Footer / Progress (Subtle) -->
<div class="absolute bottom-16 w-full flex flex-col items-center animate-fade-in-up delay-200">
<div class="w-12 h-1 bg-surface-container-highest rounded-full overflow-hidden">
<div class="h-full bg-primary rounded-full transition-all duration-[3000ms] ease-out w-0" id="splash-progress"></div>
</div>
<span class="mt-4 font-label-sm text-on-surface-variant uppercase tracking-[0.2em] opacity-40">Cultivating</span>
</div>
</main>
<script>
        // Start Progress Bar on load
        window.addEventListener('DOMContentLoaded', () => {
            const progressBar = document.getElementById('splash-progress');
            setTimeout(() => {
                progressBar.style.width = '100%';
            }, 100);

            // Create gentle floating leaf-like particles
            const atmosphere = document.getElementById('atmosphere');
            for (let i = 0; i < 15; i++) {
                const dot = document.createElement('div');
                const size = Math.random() * 4 + 2;
                dot.style.width = `${size}px`;
                dot.style.height = `${size}px`;
                dot.style.left = `${Math.random() * 100}%`;
                dot.style.top = `${Math.random() * 100}%`;
                dot.style.position = 'absolute';
                dot.style.backgroundColor = '#1b6d24';
                dot.style.borderRadius = '50%';
                dot.style.opacity = (Math.random() * 0.15).toString();
                dot.style.filter = 'blur(1px)';
                
                atmosphere.appendChild(dot);
                
                // Add gentle drift
                dot.animate([
                    { transform: 'translate(0, 0)' },
                    { transform: `translate(${Math.random() * 40 - 20}px, ${Math.random() * 40 - 20}px)` }
                ], {
                    duration: 5000 + Math.random() * 5000,
                    iterations: Infinity,
                    direction: 'alternate',
                    easing: 'ease-in-out'
                });
            }
        });

        // Click interaction to simulate entering the app
        document.body.addEventListener('click', () => {
            document.body.style.transition = 'opacity 0.8s ease-in-out';
            document.body.style.opacity = '0';
        });
    </script>
