<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Add Plant - Leaf &amp; Soil</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "surface-container-highest": "#e2e3df",
                        "on-secondary": "#ffffff",
                        "inverse-primary": "#88d982",
                        "tertiary-fixed": "#ffdbcf",
                        "surface-container": "#eeeeea",
                        "on-secondary-container": "#2e7238",
                        "outline": "#707a6c",
                        "on-primary-fixed-variant": "#005312",
                        "primary-fixed-dim": "#88d982",
                        "error-container": "#ffdad6",
                        "background": "#faf9f5",
                        "surface-tint": "#1b6d24",
                        "outline-variant": "#bfcaba",
                        "surface-container-lowest": "#ffffff",
                        "on-primary": "#ffffff",
                        "surface-container-low": "#f4f4f0",
                        "surface-container-high": "#e8e8e4",
                        "on-primary-fixed": "#002204",
                        "surface": "#faf9f5",
                        "on-surface-variant": "#40493d",
                        "on-secondary-fixed-variant": "#07521d",
                        "inverse-on-surface": "#f1f1ed",
                        "on-tertiary": "#ffffff",
                        "on-background": "#1a1c1a",
                        "surface-dim": "#dadad6",
                        "primary-fixed": "#a3f69c",
                        "secondary": "#286b33",
                        "on-error": "#ffffff",
                        "secondary-container": "#abf4ac",
                        "on-surface": "#1a1c1a",
                        "tertiary-fixed-dim": "#ebbcac",
                        "on-primary-container": "#cbffc2",
                        "on-tertiary-fixed": "#2e150b",
                        "error": "#ba1a1a",
                        "secondary-fixed-dim": "#90d792",
                        "tertiary": "#704d40",
                        "secondary-fixed": "#abf4ac",
                        "on-tertiary-container": "#ffeee8",
                        "inverse-surface": "#2f312e",
                        "primary-container": "#2e7d32",
                        "surface-bright": "#faf9f5",
                        "primary": "#0d631b",
                        "on-error-container": "#93000a",
                        "on-tertiary-fixed-variant": "#603f33",
                        "tertiary-container": "#8b6557",
                        "surface-variant": "#e2e3df",
                        "on-secondary-fixed": "#002107"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                    "spacing": {
                        "lg": "24px",
                        "base": "4px",
                        "md": "16px",
                        "xs": "4px",
                        "container-margin": "20px",
                        "gutter": "16px",
                        "xl": "32px",
                        "sm": "8px"
                    },
                    "fontFamily": {
                        "headline-lg-mobile": ["Plus Jakarta Sans"],
                        "label-lg": ["Plus Jakarta Sans"],
                        "body-md": ["Plus Jakarta Sans"],
                        "headline-lg": ["Plus Jakarta Sans"],
                        "title-lg": ["Plus Jakarta Sans"],
                        "label-sm": ["Plus Jakarta Sans"],
                        "display-lg": ["Plus Jakarta Sans"],
                        "body-lg": ["Plus Jakarta Sans"]
                    },
                    "fontSize": {
                        "headline-lg-mobile": ["28px", { "lineHeight": "36px", "fontWeight": "700" }],
                        "label-lg": ["14px", { "lineHeight": "20px", "letterSpacing": "0.1px", "fontWeight": "500" }],
                        "body-md": ["14px", { "lineHeight": "20px", "letterSpacing": "0.25px", "fontWeight": "400" }],
                        "headline-lg": ["32px", { "lineHeight": "40px", "fontWeight": "700" }],
                        "title-lg": ["22px", { "lineHeight": "28px", "fontWeight": "600" }],
                        "label-sm": ["11px", { "lineHeight": "16px", "letterSpacing": "0.5px", "fontWeight": "500" }],
                        "display-lg": ["57px", { "lineHeight": "64px", "letterSpacing": "-0.25px", "fontWeight": "700" }],
                        "body-lg": ["16px", { "lineHeight": "24px", "letterSpacing": "0.5px", "fontWeight": "400" }]
                    }
                }
            }
        }

<style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background text-on-background min-h-screen pb-[56px] md:pb-0">
<!-- TopAppBar -->
<header class="w-full top-0 sticky bg-background flex items-center justify-between px-container-margin h-16 max-w-7xl mx-auto z-50">
<button class="text-on-surface-variant hover:bg-surface-container-high rounded-full transition-colors p-2 active:scale-95 duration-200 transition-transform">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 0;">arrow_back</span>
</button>
<h1 class="font-title-lg text-title-lg text-primary tracking-tight">Add New Plant</h1>
<div class="w-10 h-10"></div> <!-- Spacer for centering -->
</header>
<main class="max-w-3xl mx-auto px-container-margin py-lg grid gap-lg md:gap-xl">
<!-- Image Upload (Glassmorphism inspired) -->
<div class="relative w-full aspect-square md:aspect-video max-w-sm mx-auto rounded-[24px] bg-surface-container-highest flex flex-col items-center justify-center overflow-hidden border border-outline-variant/30 cursor-pointer hover:bg-surface-dim transition-colors group">
<div class="absolute inset-0 bg-gradient-to-tr from-primary/5 to-transparent z-0"></div>
<span class="material-symbols-outlined text-4xl text-primary/70 z-10 group-hover:scale-110 transition-transform duration-300" style="font-variation-settings: 'FILL' 0;">add_a_photo</span>
<p class="font-body-md text-body-md text-on-surface-variant mt-sm z-10">Upload Plant Photo</p>
</div>
<!-- Form Fields -->
<form class="grid gap-lg">
<!-- Details Section -->
<section class="bg-surface-container-lowest rounded-[24px] p-md md:p-lg shadow-[0_4px_12px_rgba(0,0,0,0.04)] grid gap-md">
<h2 class="font-title-lg text-title-lg text-on-surface mb-sm">Plant Details</h2>
<div>
<label class="block font-label-lg text-label-lg text-on-surface-variant mb-xs">Plant Name</label>
<input class="w-full bg-surface-container-low border-b-2 border-transparent focus:border-primary focus:ring-0 rounded-2xl px-md py-sm font-body-lg text-body-lg text-on-surface placeholder:text-outline outline-none transition-colors" placeholder="e.g. Monstera Deliciosa" type="text"/>
</div>
<div>
<label class="block font-label-lg text-label-lg text-on-surface-variant mb-xs">Variety (Optional)</label>
<input class="w-full bg-surface-container-low border-b-2 border-transparent focus:border-primary focus:ring-0 rounded-2xl px-md py-sm font-body-lg text-body-lg text-on-surface placeholder:text-outline outline-none transition-colors" placeholder="e.g. Thai Constellation" type="text"/>
</div>
</section>
<!-- Categorization Section -->
<section class="bg-surface-container-lowest rounded-[24px] p-md md:p-lg shadow-[0_4px_12px_rgba(0,0,0,0.04)] grid gap-md">
<h2 class="font-title-lg text-title-lg text-on-surface mb-sm">Categorization</h2>
<div>
<label class="block font-label-lg text-label-lg text-on-surface-variant mb-xs">Category</label>
<div class="flex flex-wrap gap-sm">
<label class="cursor-pointer">
<input class="peer sr-only" name="category" type="radio"/>
<span class="inline-block px-md py-sm rounded-full bg-surface-container-highest text-on-surface-variant font-label-lg text-label-lg peer-checked:bg-primary-container peer-checked:text-on-primary-container transition-colors">Vegetable</span>
</label>
<label class="cursor-pointer">
<input class="peer sr-only" name="category" type="radio"/>
<span class="inline-block px-md py-sm rounded-full bg-surface-container-highest text-on-surface-variant font-label-lg text-label-lg peer-checked:bg-primary-container peer-checked:text-on-primary-container transition-colors">Fruit</span>
</label>
<label class="cursor-pointer">
<input class="peer sr-only" name="category" type="radio"/>
<span class="inline-block px-md py-sm rounded-full bg-surface-container-highest text-on-surface-variant font-label-lg text-label-lg peer-checked:bg-primary-container peer-checked:text-on-primary-container transition-colors">Herb</span>
</label>
<label class="cursor-pointer">
<input class="peer sr-only" name="category" type="radio"/>
<span class="inline-block px-md py-sm rounded-full bg-surface-container-highest text-on-surface-variant font-label-lg text-label-lg peer-checked:bg-primary-container peer-checked:text-on-primary-container transition-colors">Flower</span>
</label>
<label class="cursor-pointer">
<input class="peer sr-only" name="category" type="radio"/>
<span class="inline-block px-md py-sm rounded-full bg-surface-container-highest text-on-surface-variant font-label-lg text-label-lg peer-checked:bg-primary-container peer-checked:text-on-primary-container transition-colors">Tree</span>
</label>
</div>
</div>
<div class="grid grid-cols-1 md:grid-cols-2 gap-md">
<div>
<label class="block font-label-lg text-label-lg text-on-surface-variant mb-xs">Planting Date</label>
<input class="w-full bg-surface-container-low border-b-2 border-transparent focus:border-primary focus:ring-0 rounded-2xl px-md py-sm font-body-lg text-body-lg text-on-surface outline-none transition-colors" type="date"/>
</div>
<div>
<label class="block font-label-lg text-label-lg text-on-surface-variant mb-xs">Location</label>
<div class="relative">
<select class="w-full appearance-none bg-surface-container-low border-b-2 border-transparent focus:border-primary focus:ring-0 rounded-2xl px-md py-sm font-body-lg text-body-lg text-on-surface outline-none transition-colors pr-10">
<option>Indoor</option>
<option>Outdoor</option>
<option>Balcony</option>
<option>Greenhouse</option>
</select>
<span class="material-symbols-outlined absolute right-3 top-1/2 -translate-y-1/2 text-on-surface-variant pointer-events-none" style="font-variation-settings: 'FILL' 0;">arrow_drop_down</span>
</div>
</div>
</div>
</section>
<!-- Care Routine Section -->
<section class="bg-surface-container-lowest rounded-[24px] p-md md:p-lg shadow-[0_4px_12px_rgba(0,0,0,0.04)] grid gap-md">
<h2 class="font-title-lg text-title-lg text-on-surface mb-sm">Care Routine</h2>
<div>
<div class="flex justify-between items-center mb-xs">
<label class="font-label-lg text-label-lg text-on-surface-variant flex items-center gap-2">
<span class="material-symbols-outlined text-primary" style="font-variation-settings: 'FILL' 1;">water_drop</span>
                            Watering Frequency
                        </label>
<span class="font-body-md text-body-md text-primary font-medium">Every <span id="water-val">7</span> days</span>
</div>
<input class="w-full accent-primary h-2 bg-surface-container-high rounded-full appearance-none cursor-pointer" max="30" min="1" oninput="document.getElementById('water-val').innerText = this.value" type="range" value="7"/>
</div>
<div class="mt-sm">
<div class="flex justify-between items-center mb-xs">
<label class="font-label-lg text-label-lg text-on-surface-variant flex items-center gap-2">
<span class="material-symbols-outlined text-tertiary" style="font-variation-settings: 'FILL' 1;">eco</span>
                            Fertilizer Frequency
                        </label>
<span class="font-body-md text-body-md text-tertiary font-medium">Every <span id="fert-val">14</span> days</span>
</div>
<input class="w-full accent-tertiary h-2 bg-surface-container-high rounded-full appearance-none cursor-pointer" max="60" min="0" oninput="document.getElementById('fert-val').innerText = this.value" type="range" value="14"/>
</div>
</section>
<!-- Submit Action -->
<div class="mt-md mb-xl">
<button class="w-full bg-primary text-on-primary font-label-lg text-label-lg h-14 rounded-full shadow-[0_4px_12px_rgba(0,0,0,0.04)] hover:bg-surface-tint active:scale-95 transition-all duration-200 flex items-center justify-center gap-2" type="button">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">add</span>
                    Add to My Garden
                </button>
</div>
</form>
</main>
</body></html>
